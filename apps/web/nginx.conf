# nginx in front of the SPA and the API, on one origin.
#
# Same-origin is a hard requirement, not a preference: the session cookie is
# host-only with SameSite=Lax and the API client uses
# credentials: "same-origin". Serving the bundle from a different hostname than
# the API means the cookie is never sent and every request is a 401.
#
# Mirrors the dev proxy in apps/web/vite.config.ts — if you change a route
# here, change it there too.
#
# This file is an envsubst template (/etc/nginx/templates/*.template in the
# official image), because the Content-Security-Policy below has to name the
# Document Server's origin and hardcoding it would break the first deployment
# that moves the editor. NGINX_ENVSUBST_FILTER restricts substitution to PP_*
# so nginx's own $host, $remote_addr and friends survive.

# Docker's embedded DNS. Resolving through a variable rather than an
# `upstream` block is deliberate: nginx resolves upstream hostnames once, at
# startup, so a `server` container that is not up yet (or is mid-redeploy)
# takes nginx down with "host not found in upstream". With a resolver and a
# variable the lookup happens per request, so the proxy survives the API
# restarting underneath it and answers 502 in the meantime.
resolver 127.0.0.11 valid=10s ipv6=off;

# GET /s/<token> means two different things depending on who is asking:
# the server answers it as JSON (handleShareInfo), and the SPA has a page at
# the same path. A top-level browser navigation sends Accept: text/html and
# must get the page; the SPA's own fetch() must get the JSON. This is the same
# bypass the Vite dev server does.
map $http_accept $share_wants_html {
    default       0;
    "~*text/html" 1;
}

# A share token is the entire authorization for anonymous access to a file,
# and it is a path segment — so the default access log wrote every live link
# to stdout, and from there to the container log, a log index or a support
# bundle. Only the token's SHA-256 is stored in the database; logging the
# plaintext beside it made that pointless. The shape of the request stays
# readable, which is the only reason to log it at all.
map $uri $logged_uri {
    "~^/s/[^/]+(?<share_rest>/.*)?$"  "/s/REDACTED$share_rest";
    default                           $uri;
}

# The collaboration socket's hop-by-hop upgrade. nginx drops Upgrade and
# Connection on the way upstream unless told to pass them; a request that is
# not an upgrade goes on as an ordinary one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $logged_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    # Dual-stack on purpose. `listen 80` alone binds IPv4 only, and anything
    # resolving `localhost` inside the container gets ::1 first — which is how
    # the image's own healthcheck sat at "unhealthy" while nginx was serving
    # every request correctly. A v6-capable reverse proxy would have hit the
    # same refusal.
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/access.log redacted;

    # No version number on responses or error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API service name, as compose defines it.
    set $api http://server:8080;

    # Uploads stream straight through. The default 1m body limit would reject
    # any file over a megabyte long before the app's own quota check runs, and
    # buffering a multi-GB upload to nginx's disk first would be worse. The
    # ceiling lives in the app (PP_MAX_UPLOAD_BYTES), which can answer 413
    # with a sentence instead of nginx's bare page.
    client_max_body_size 0;
    proxy_request_buffering off;

    # Long enough for a slow upload or an OnlyOffice conversion to finish.
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Headers this proxy does not set are headers the client sets, and the app
    # keys its rate limits and its session records on the client address. Any
    # of these three, forwarded verbatim, would let a caller choose that
    # address — so they are cleared here as well as being ignored by the Go
    # side, which only believes X-Forwarded-For from a configured
    # PP_TRUSTED_PROXIES hop. X-Forwarded-For itself is *appended* to above,
    # deliberately: the app reads the chain from the right.
    proxy_set_header True-Client-IP   "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded        "";

    # The stock nginx.conf ships `#gzip on;`, so without this the whole bundle
    # goes out raw — the entry chunk alone is 378 KB uncompressed against
    # 118 KB gzipped. Vite emits content-hashed names, so compressing on the
    # fly costs one pass per cold cache entry and nothing after.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        image/svg+xml
        application/manifest+json
        text/plain;

    # --- Security response headers ---
    #
    # Two directives here are deliberately looser than the value every guide
    # recommends, and tightening them breaks the app:
    #
    #   object-src 'self'  — not 'none'. The PDF viewer is an <object> pointed
    #     at /api/v1/nodes/{id}/content. 'none' blocks it and renders the
    #     fallback children instead, so it fails as a silent UI regression.
    #   form-action / frame-src name ${PP_ONLYOFFICE_URL} — the editor handoff
    #     is a real cross-origin form POST into an iframe. 'self' alone leaves
    #     the editor frame blank.
    #
    # And one is looser than it should be for a reason worth fixing later:
    #
    #   style-src 'unsafe-inline' — a handful of React `style` props (progress
    #     meters, tree indentation) plus sonner's runtime <style> injection.
    #     This is the only directive that needs code changes to tighten.
    #
    # script-src needs no nonce: the built index.html has zero inline script
    # and the SPA has no dangerouslySetInnerHTML anywhere.
    #
    # frame-ancestors 'none' is safe because pp-hub is always the framer and
    # never the framed — nothing reads window.parent or listens for
    # postMessage.
    #
    # connect-src names this host's own socket origin — wss: and, for a
    # plain-http deployment, ws: — for the block editor's collaboration
    # socket. CSP3 lets 'self' cover it, but older WebKit does not match a
    # ws(s) URL against 'self'. $http_host is the host (and port) the browser
    # asked for, so it is always this deployment; an https page cannot open a
    # ws: socket at all (mixed content), so the ws: entry costs it nothing.
    #
    # `always` on every one of them: without it nginx omits add_header on
    # 4xx/5xx, including the 502s this config is designed to return while the
    # API restarts.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'self'; frame-src 'self' ${PP_ONLYOFFICE_URL}; form-action 'self' ${PP_ONLYOFFICE_URL}; frame-ancestors 'none'; base-uri 'none'; connect-src 'self' wss://$http_host ws://$http_host" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /healthz { proxy_pass $api; }
    location /api/    { proxy_pass $api; }
    location /auth/   { proxy_pass $api; }

    # The block editor's collaboration sockets (Hocuspocus over WebSocket).
    # A location of its own because a socket is not a request: it needs the
    # upgrade headers passed on and a read timeout measured in hours rather
    # than the ten minutes an upload gets — the server pings every 15 s, so a
    # silent hour is a dead peer.
    #
    # nginx inherits proxy_set_header only into a location that sets none of
    # its own, so declaring Upgrade/Connection here drops every server-level
    # one: they are repeated, including the cleared client-address headers.
    location /api/v1/collab/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header True-Client-IP    "";
        proxy_set_header CF-Connecting-IP  "";
        proxy_set_header Forwarded         "";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # The notification stream (Server-Sent Events). Buffering would hold each
    # event until nginx's buffer filled, i.e. forever; and the read timeout is
    # an hour like the sockets' — the server writes a heartbeat every 25 s, so
    # a silent hour is a dead client. No proxy_set_header here, so the
    # server-level ones (client-address headers included) are inherited.
    location = /api/v1/notifications/stream {
        proxy_pass $api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # An extension's live stream (M44): /api/v1/ext/<id>/…/events, Server-Sent
    # Events like the notification stream above and for the same reasons. A
    # regex location outranks the /api/ prefix, so only these paths lose their
    # buffering and gain the long read timeout.
    location ~ ^/api/v1/ext/[^/]+/.+/events$ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Logto webhook deliveries (POST /hooks/logto). Deliberately outside
    # /api/ — that group is authenticated and same-origin-checked — so it
    # needs its own location or every delivery lands on the SPA fallback and
    # nginx answers 405 to Logto's POST. The handler is authenticated by an
    # HMAC over the raw body (PP_LOGTO_WEBHOOK_KEY), not by a session.
    location /hooks/  { proxy_pass $api; }

    # The MCP server agents (Claude, ChatGPT) talk to. Outside /api/ because
    # it is bearer-only — no cookie, no same-origin check. Buffering is off
    # like the notification stream's, so a client that asks for a streamed
    # answer gets one. The exact `/mcp` is proxied too: a connector URL
    # pasted without its slash must reach the server, not the SPA fallback.
    # No proxy_set_header here, so the server-level ones are inherited.
    location /mcp/ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /mcp { proxy_pass $api; }

    # RFC 9728 protected-resource metadata: the first thing Claude and ChatGPT
    # fetch, before any sign-in, to learn which authorization server issues
    # tokens for /mcp/. Prefix match covers the /mcp-suffixed variant.
    location /.well-known/oauth-protected-resource { proxy_pass $api; }

    # WebDAV (Finder, Explorer, rclone mounting the drive). Outside /api/ for
    # the same reason as /mcp/: Basic auth with a personal token, no cookie,
    # no same-origin check. Files stream both ways, so neither direction is
    # buffered, there is no body limit here, and the timeouts are an hour —
    # a multi-GB copy over a slow link outlasts the ten minutes /api/ gets.
    # The DAV headers (Authorization, Depth, Destination, Overwrite, If,
    # Lock-Token, Timeout) go upstream as the client sent them: nginx passes
    # request headers through by default and nothing here overrides them. No
    # proxy_set_header, so the server-level ones are inherited. The exact
    # `/dav` is proxied too, for a client given the URL without its slash —
    # never the SPA fallback.
    location /dav/ {
        proxy_pass $api;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /dav { proxy_pass $api; }

    # /wopi/ is deliberately NOT proxied.
    #
    # The Document Server reaches those endpoints over the compose network:
    # PP_WOPI_SERVER_URL is `http://server:8080`, and that value is what
    # becomes the WOPISrc it fetches, so the browser never calls this path and
    # no deployment here needs it published. Publishing it anyway turned the
    # WOPI access token from a credential that only mattered inside the
    # network into an internet-wide bearer token — on the one route group
    # exempt from both the same-origin check and the rate limiter, because the
    # Document Server sends no Origin and is authorized by a signed token
    # instead.
    #
    # A deployment that runs OnlyOffice outside this network must set
    # PP_WOPI_SERVER_URL to a public URL *and* re-add a location here,
    # ideally restricted to the Document Server's address.

    # Share-link sub-paths (/download, /children, /content, …) are always the
    # API — only the bare token is ambiguous.
    location ~ ^/s/[^/]+/ {
        proxy_pass $api;
    }

    location ~ ^/s/[^/]+$ {
        if ($share_wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass $api;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    #
    # No `expires` directive: it emits its own Cache-Control, and combined with
    # the add_header below the response carried two conflicting Cache-Control
    # lines. `immutable` is the part worth having, so keep only this one.
    #
    # The security headers are repeated here and in /index.html because nginx
    # does not merge add_header across levels: a location that declares any
    # add_header of its own discards every inherited one. Without the repeat,
    # the bundle and the HTML entry point — the two responses a CSP is for —
    # would ship bare.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'self'; frame-src 'self' ${PP_ONLYOFFICE_URL}; form-action 'self' ${PP_ONLYOFFICE_URL}; frame-ancestors 'none'; base-uri 'none'; connect-src 'self' wss://$http_host ws://$http_host" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy is invisible until the
    # browser happens to revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'self'; frame-src 'self' ${PP_ONLYOFFICE_URL}; form-action 'self' ${PP_ONLYOFFICE_URL}; frame-ancestors 'none'; base-uri 'none'; connect-src 'self' wss://$http_host ws://$http_host" always;
    }

    # Everything else is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
