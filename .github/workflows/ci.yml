# Everything that must be green before a change lands on main.
#
# Also called by release.yml (`workflow_call`) on the commit being released, so
# a release is held to exactly the checks a pull request is.
#
# The message catalogs are checked by i18n.yml, which only runs when web
# sources change.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (check, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # routeTree.gen.ts is generated and gitignored; typechecking the routes
      # without it fails on every `createFileRoute` path.
      - name: Generate route tree
        working-directory: apps/web
        run: bunx tsr generate

      - name: Check (format, lint, typecheck)
        run: bunx vp check

      - name: Unit tests
        run: bunx vp run -r test

      - name: Build
        run: bunx vp run -r build

  server:
    name: Server (vet, test, sqlc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    services:
      # The permission and job-queue invariants live in SQL, so their tests need
      # a real database; without PP_TEST_DATABASE_URL they skip and prove nothing.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pphub
          POSTGRES_PASSWORD: pphub
          POSTGRES_DB: pphub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pphub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        env:
          PP_TEST_DATABASE_URL: postgres://pphub:pphub@localhost:5432/pphub?sslmode=disable
        run: go test -p 1 ./...

      # Generated code is committed; this fails when a migration or query changed
      # without `sqlc generate`. Keep the version in step with the header of the
      # generated files.
      - name: Check generated sqlc code is current
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff

  images:
    name: Image build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            dockerfile: apps/server/Dockerfile
          - name: worker
            context: .
            dockerfile: apps/server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only: a broken Dockerfile is found here rather than after the merge.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.name }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
