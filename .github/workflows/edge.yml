# Every push to main publishes :edge and :sha-<sha> for the three images, so
# there is always something current to try on a staging host. Pin a released
# version (release.yml) for production; :edge is a moving target.
name: edge

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  images:
    name: Edge images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ""
