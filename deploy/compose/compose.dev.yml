# pp-hub — everything EXCEPT the app itself.
#
# For local development, where you run the Go server and the Vite dev server
# from source rather than from images:
#
#   docker compose -f deploy/compose/compose.dev.yml up -d
#   cd apps/server && cp .env.example .env   # once
#   cd apps/server && set -a && source .env && set +a && go run ./cmd/server
#   vp run dev                                   # from the repo root
#
# Unlike compose.prod.yml, every service here publishes a host port, because
# the processes connecting to them run on your machine rather than on a
# container network.
#
# Profiles keep the heavy optional pieces out of the default `up`:
#
#   (default)          postgres + onlyoffice + wopi-proxy
#   --profile worker   + preview worker (PDF/video/office thumbnails)
#   --profile s3       + SeaweedFS, for developing against the S3 blob backend
#   --profile idp      + self-hosted Logto, instead of Logto Cloud
#
# Combine freely:  docker compose -f compose.dev.yml --profile worker up -d
name: pp-hub-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: pphub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pphub
      POSTGRES_PASSWORD: pphub
      POSTGRES_DB: pphub
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Override when 5432 is already taken on the host (another local
      # Postgres): set PP_POSTGRES_PORT in deploy/compose/.env and keep
      # PP_DATABASE_URL in apps/server/.env pointing at the same port.
      - "${PP_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pphub -d pphub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Document Server's WOPI callbacks reach your host-run Go server through
  # this forwarder, not through host.docker.internal.
  #
  # OnlyOffice 10 refuses to call a WOPI host unless an ipfilter rule names it
  # (see the onlyoffice service), and it refuses outright — no rule can allow
  # it — the address host.docker.internal resolves to on OrbStack
  # (0.250.250.254). A container on this network has an ordinary private
  # address and a stable name, so that is what OnlyOffice and the worker are
  # given as PP_WOPI_SERVER_URL; the forwarder hands the bytes on to the
  # server's WOPI listener (PP_WOPI_ADDR, :8081) on your machine.
  wopi-proxy:
    image: alpine/socat:1.8.0.3
    container_name: pphub-wopi-proxy
    restart: unless-stopped
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:host.docker.internal:8081"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  onlyoffice:
    # Same pin as compose.prod.yml: developing against a different editor
    # build than production ships is how WOPI regressions get missed.
    image: onlyoffice/documentserver:10.0.0.1
    container_name: pphub-onlyoffice
    restart: unless-stopped
    environment:
      # Signed, same as production. The Document Server has no other access
      # control: without this, anything that can reach port 9980 can ask it
      # to convert — which means asking it to fetch a URL of the caller's
      # choosing, from inside the network, with the allowances below.
      #
      # The dev default is a fixed well-known string so the stack comes up
      # without ceremony; it must match PP_ONLYOFFICE_JWT_SECRET in
      # apps/server/.env, which is where the worker reads it from.
      - JWT_ENABLED=true
      - JWT_SECRET=${PP_ONLYOFFICE_JWT_SECRET:-pphub-dev-onlyoffice-jwt-secret}
      - ONLYOFFICE_HTTPS_ENABLED=false
      - WOPI_ENABLED=true
      # host.docker.internal resolves to a link-local-ish gateway address
      # (OrbStack: 0.250.250.254). The request-filtering-agent blocks that as
      # a "meta" IP by default, which only matters for the one thing still
      # fetched from the host directly: the live conversion test
      # (PP_TEST_CALLBACK_HOST=host.docker.internal). WOPI no longer goes there.
      # Both are only reachable behind the signature above.
      - ALLOW_META_IP_ADDRESS=true
      - ALLOW_PRIVATE_IP_ADDRESS=true
      # The AI plugin, off unless PP_ONLYOFFICE_AI=true in this directory's
      # .env. 9.x installed it on first start; 10.0.0.1 dropped it from the
      # default plugin list, so the entrypoint below adds it back. The first
      # start then needs to reach onlyoffice.github.io to fetch it.
      - ENABLE_AI_PLUGIN=${PP_ONLYOFFICE_AI:-false}
    # Written before the image's own entrypoint runs, as a file beside
    # local.json rather than over it: the entrypoint rewrites local.json from
    # the variables above, and node-config reads local-production-linux.json
    # after it. Rules are evaluated for every URL the editor is handed (file
    # download, callback, WOPI action). Since 10.0 the WOPI host must be NAMED
    # by a rule — `* allowed` no longer counts — so each host the server is
    # known by is listed, and everything else is refused.
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/onlyoffice/documentserver/local-production-linux.json <<'EOF'
        {"services":{"CoAuthoring":{"ipfilter":{"rules":[
          {"address":"wopi-proxy","allowed":true},
          {"address":"host.docker.internal","allowed":true},
          {"address":"*","allowed":false}
        ]}}}}
        EOF
        if [ "$$ENABLE_AI_PLUGIN" = "true" ] && ! grep -q '"ai"' /var/www/onlyoffice/documentserver/sdkjs-plugins/plugin-list-default.json; then
          sed -i 's/^\[/[\n\t"ai",/' /var/www/onlyoffice/documentserver/sdkjs-plugins/plugin-list-default.json
        fi
        exec /app/ds/run-document-server.sh
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    ports:
      - "9980:80"
    # Reaches your Go server, which runs on the host rather than in compose.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --profile worker
  #
  # Runs in Docker even in development, because the renderers need pdftoppm
  # and ffmpeg. A worker built from source on a machine without poppler simply
  # would not register render:pdf, and PDFs would silently never thumbnail.
  #
  # PP_BLOB_ROOT is bind-mounted to the *host* directory your local server
  # writes to, so both see one blob store. Get this wrong and thumbnails
  # generate somewhere the server cannot read them.
  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      target: worker
    container_name: pphub-worker
    restart: unless-stopped
    environment:
      PP_DATABASE_URL: postgres://pphub:pphub@postgres:5432/pphub?sslmode=disable
      PP_BLOB_ROOT: /data/blobs
      PP_ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      # Your host-run server's WOPI listener, through the forwarder (see
      # wopi-proxy): the name OnlyOffice's ipfilter allows.
      PP_WOPI_SERVER_URL: ${PP_WOPI_SERVER_URL:-http://wopi-proxy:8081}
      # Must match the onlyoffice service's JWT_SECRET above, and the value in
      # apps/server/.env. An unsigned conversion request answers {"error":-8}.
      PP_ONLYOFFICE_JWT_SECRET: ${PP_ONLYOFFICE_JWT_SECRET:-pphub-dev-onlyoffice-jwt-secret}
      # Must match the server's key. PP_DEV_INSECURE=1 gives both processes the
      # same fixed development key — unless the server has a PP_SESSION_KEY of
      # its own, which wins over it. Then set the same PP_SESSION_KEY in this
      # directory's .env, or the worker's conversion tokens verify against a
      # different key and every office thumbnail fails with a 401 from /wopi.
      PP_SESSION_KEY: ${PP_SESSION_KEY:-}
      PP_DEV_INSECURE: ${PP_DEV_INSECURE:-1}
      # The worker reads and writes the same blobs as the server, so it has to
      # use the same backend. With `--profile s3` set PP_BLOB_BACKEND=s3 in
      # this directory's .env; the endpoint differs per side — the host server
      # reaches SeaweedFS on localhost:8333, the worker on the compose network.
      PP_BLOB_BACKEND: ${PP_BLOB_BACKEND:-local}
      PP_S3_BUCKET: ${PP_S3_BUCKET:-pphub}
      PP_S3_ENDPOINT: ${PP_S3_ENDPOINT_INTERNAL:-http://seaweedfs:8333}
      PP_S3_ACCESS_KEY_ID: ${PP_S3_ACCESS_KEY_ID:-pphub}
      PP_S3_SECRET_ACCESS_KEY: ${PP_S3_SECRET_ACCESS_KEY:-pphub-dev-secret}
      PP_S3_PATH_STYLE: ${PP_S3_PATH_STYLE:-1}
    volumes:
      - ../../apps/server/data/blobs:/data/blobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy

  # --profile s3
  #
  # SeaweedFS with its S3 gateway, for developing against the object-storage
  # backend. Credentials come from seaweedfs/s3.json, which is committed
  # because these are fixed development values.
  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:latest
    container_name: pphub-seaweedfs
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333" # S3 API      → PP_S3_ENDPOINT=http://localhost:8333
      - "9333:9333" # master UI
      - "8888:8888" # filer
    healthcheck:
      # weed binds the master to the container's IP, not loopback, so
      # http://localhost:9333 is refused and this check would never pass.
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket and exits. The app never creates buckets — that would
  # need broader credentials than reading and writing objects.
  seaweedfs-init:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      sh -c "echo 's3.bucket.create -name pphub' | weed shell -master=seaweedfs:9333"
    restart: "no"

  # --profile idp
  #
  # Self-hosted Logto, for working offline or without a Logto Cloud tenant.
  # Its own database, separate from the app's. First start takes ~30s while
  # Logto migrates.
  logto-db:
    profiles: ["idp"]
    image: postgres:16-alpine
    container_name: pphub-logto-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logto
    volumes:
      - logto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  logto:
    profiles: ["idp"]
    image: svhd/logto:latest
    container_name: pphub-logto
    restart: unless-stopped
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: "true"
      DB_URL: postgres://postgres:postgres@logto-db:5432/logto
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    ports:
      - "3001:3001" # OIDC issuer / API → PP_OIDC_ISSUER=http://localhost:3001/oidc
      - "3002:3002" # admin console
    depends_on:
      logto-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --profile mail — a local SMTP catcher; UI on http://localhost:8025
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    container_name: pphub-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP → host localhost, port 1025, TLS none
      - "8025:8025" # web UI + API

volumes:
  pg_data:
  onlyoffice_data:
  onlyoffice_logs:
  seaweed_data:
  logto_pg_data:
