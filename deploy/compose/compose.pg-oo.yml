# PostgreSQL (app data) + OnlyOffice — main dev stack
# Use with Logto Cloud as the IdP (no IdP container needed).
# For a fully local IdP, see compose.logto.yml.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pphub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pphub
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: pphub-onlyoffice
    environment:
      - JWT_ENABLED=false
      - ONLYOFFICE_HTTPS_ENABLED=false
      # OnlyOffice 9.x requires WOPI_ENABLED=true to serve /hosting/discovery
      # and /hosting/wopi/{type}/edit.
      - WOPI_ENABLED=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    ports:
      - "9980:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  onlyoffice_data:
  onlyoffice_logs:
