# pp-hub — full production stack for a VPS or Dokploy.
#
# Everything the app needs, from images published by the release flow (CONTRIBUTING.md#releasing).
# Deliberately publishes no host ports: Dokploy's Traefik routes to containers
# over its own network, and binding 80/443 here would collide with it. For a
# plain VPS with your own reverse proxy, uncomment the `ports:` blocks marked
# PLAIN VPS.
#
#   cp deploy/compose/.env.prod.example deploy/compose/.env.prod   # then fill it in
#   docker compose -f deploy/compose/compose.prod.yml \
#     --env-file deploy/compose/.env.prod up -d
#
# --env-file is REQUIRED: without it compose auto-loads `.env` from this
# directory, which is the development file. See .env.prod.example.
#
# PP_IMAGE_TAG pins the release. It has no default on purpose: `latest` is not
# a version, and a stack whose running code cannot be named is a stack that
# cannot be rolled back. Deploying is setting it and re-running the command
# above; rolling back is setting it to the previous tag.
#
# This file only ever pulls. Building from a checkout is the override
# `compose.build.yml`, kept separate because Dokploy runs `up -d --build`
# unconditionally: a `build:` section here would win over the pinned tag, and
# on a "docker raw" application — where the compose file is the only thing
# copied to the server — the build context does not exist at all.
#
# Dokploy: paste this file, leave it unlabelled, and assign domains in the
# Domains tab — Dokploy injects the Traefik labels and network itself.
# Two domains are needed:
#
#   server      → port 8080  e.g. drive.example.com
#   onlyoffice  → port 80    e.g. office.example.com
#
# Never assign a domain to server's port 8081: that is the WOPI listener, for
# the Document Server alone (see docs/deployment.md).
#
# OnlyOffice needs its own hostname because the browser loads the editor from
# it directly, in an iframe. See docs/deployment.md.

services:
  # The public entry point: serves the SPA and the API on one origin.
  # Same-origin is required — the session cookie is host-only with
  # SameSite=Lax, so a split hostname means nobody can log in. The server
  # serves the bundle itself (PP_WEB_DIR is set in the image).
  server:
    image: "ghcr.io/pp-techs/pp-hub-server:${PP_IMAGE_TAG:?set in .env - a released tag, e.g. 0.1.0}"
    restart: unless-stopped
    expose:
      - "8080"
      # WOPI — the Document Server's and the worker's callback surface,
      # authorized by a token in the URL. Reachable on the compose networks
      # only: never publish it, never give it a domain.
      - "8081"
      # Prometheus /metrics — internal only, never published or proxied.
      # Scrape it by attaching a Prometheus to the `edge` network.
      - "9091"
    # PLAIN VPS (no Traefik): publish 8080 and point your own proxy at it.
    # Publish nothing else.
    # ports:
    #   - "127.0.0.1:8090:8080"
    #
    # This container terminates every public request, so it gets the same
    # treatment the worker already had. Nothing here binds a port below 1024,
    # so no capability needs to come back.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PP_ADDR: ":8080"
      PP_WOPI_ADDR: ":8081"
      PP_METRICS_ADDR: "${PP_METRICS_ADDR:-:9091}"
      PP_LOG_LEVEL: "${PP_LOG_LEVEL:-info}"
      PP_LOG_FORMAT: "${PP_LOG_FORMAT:-json}"
      # The public URL of this server. This is the OIDC redirect base and the
      # post-logout target, so it must be the address users actually type.
      PP_EXTERNAL_URL: "${PP_EXTERNAL_URL:?set in .env}"
      PP_DATABASE_URL: postgres://pphub:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/pphub?sslmode=disable

      PP_OIDC_ISSUER: "${PP_OIDC_ISSUER:?set in .env}"
      PP_OIDC_ISSUER_EXTERNAL: "${PP_OIDC_ISSUER_EXTERNAL:-}"
      PP_OIDC_CLIENT_ID: "${PP_OIDC_CLIENT_ID:?set in .env}"
      PP_OIDC_CLIENT_SECRET: "${PP_OIDC_CLIENT_SECRET:?set in .env}"
      PP_OIDC_PHONE_SCOPE: "${PP_OIDC_PHONE_SCOPE:-0}"

      # The master secret. Nothing signs with it directly — config.DeriveKey
      # issues a purpose-bound subkey per signer — and sessions are rows, so
      # rotating this does not sign anyone out. It must be identical here and
      # in the worker, which mints the office-conversion tokens this server
      # verifies; without that, those previews stay pending.
      PP_SESSION_KEY: "${PP_SESSION_KEY:?set in .env - generate with openssl rand -base64 32}"

      # Browser-facing OnlyOffice URL — goes into the editor iframe src.
      PP_ONLYOFFICE_URL: "${PP_ONLYOFFICE_URL:?set in .env}"
      # How OnlyOffice reaches this server. Inside the compose network that is
      # the service name, so WOPI never leaves the host. Port 8081, not the
      # public 8080: /wopi is not served there.
      PP_WOPI_SERVER_URL: http://server:8081
      # The Document Server as the server reaches it over the compose network.
      # With the secret below, the server asks it every
      # PP_OFFICE_AUTOSAVE_INTERVAL to write open documents back, so a restart
      # of either side loses minutes of typing rather than the whole session
      # (the Document Server hands a document to this server only when the
      # last editor leaves). The secret is the Document Server's JWT_SECRET,
      # the same value the worker signs conversions with.
      PP_ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      PP_ONLYOFFICE_JWT_SECRET: "${PP_ONLYOFFICE_JWT_SECRET:?set in .env - generate with openssl rand -base64 32}"
      # A duration of at least 1m, or "off". Each round that finds edits adds
      # a version to the file's history.
      PP_OFFICE_AUTOSAVE_INTERVAL: "${PP_OFFICE_AUTOSAVE_INTERVAL:-5m}"

      # Whoever signs in with this address becomes an instance admin, on
      # every sign-in. Without it a fresh install has no administrator and no
      # way to appoint one except by hand in psql. Requires a verified email
      # claim. Unset it once a second admin exists.
      PP_BOOTSTRAP_ADMIN_EMAIL: "${PP_BOOTSTRAP_ADMIN_EMAIL:-}"
      # Ceiling on one upload body. A space's quota is checked only after the
      # bytes have landed and defaults to unlimited, so without this one
      # caller can fill the disk.
      PP_MAX_UPLOAD_BYTES: "${PP_MAX_UPLOAD_BYTES:-5G}"
      # Publishing (M50). Empty serves published sites under /a/ on
      # PP_EXTERNAL_URL (sandbox CSP only); set to a separate domain routed to
      # this service to isolate them.
      PP_ARTIFACT_URL: "${PP_ARTIFACT_URL:-}"
      PP_MAX_PUBLICATION_BYTES: "${PP_MAX_PUBLICATION_BYTES:-50M}"
      # Daily budget for re-hashing stored blobs to find damage; 0 disables.
      PP_BLOB_SCRUB_BYTES_PER_DAY: "${PP_BLOB_SCRUB_BYTES_PER_DAY:-100G}"
      # Retention for the security log — sign-ins, failures, admin and
      # permission changes.
      PP_AUDIT_RETENTION_DAYS: "${PP_AUDIT_RETENTION_DAYS:-365}"
      # Outgoing mail relay: optional fallback; the admin console can set or override it.
      PP_SMTP_HOST: "${PP_SMTP_HOST:-}"
      PP_SMTP_PORT: "${PP_SMTP_PORT:-587}"
      PP_SMTP_USERNAME: "${PP_SMTP_USERNAME:-}"
      PP_SMTP_PASSWORD: "${PP_SMTP_PASSWORD:-}"
      PP_SMTP_FROM: "${PP_SMTP_FROM:-}"
      PP_SMTP_TLS: "${PP_SMTP_TLS:-starttls}"
      # Whose X-Forwarded-For to believe. The per-IP rate limits and the
      # address recorded on a session are only worth anything if the caller
      # cannot choose it, so nothing is trusted unless it is named here. The
      # default covers Docker's own bridge networks, which is where Traefik or
      # a proxy on this host sits; add its range if it lives outside them.
      PP_TRUSTED_PROXIES: "${PP_TRUSTED_PROXIES:-172.16.0.0/12}"

      PP_BLOB_BACKEND: "${PP_BLOB_BACKEND:-local}"
      PP_BLOB_ROOT: /data/blobs
      PP_S3_BUCKET: "${PP_S3_BUCKET:-}"
      PP_S3_ENDPOINT: "${PP_S3_ENDPOINT:-}"
      PP_S3_REGION: "${PP_S3_REGION:-}"
      PP_S3_ACCESS_KEY_ID: "${PP_S3_ACCESS_KEY_ID:-}"
      PP_S3_SECRET_ACCESS_KEY: "${PP_S3_SECRET_ACCESS_KEY:-}"
      PP_S3_PATH_STYLE: "${PP_S3_PATH_STYLE:-1}"

      # Logto is the identity provider and the source of membership; the
      # server refuses to start without the endpoint and the M2M credentials.
      PP_LOGTO_ENDPOINT: "${PP_LOGTO_ENDPOINT:?set in .env}"
      PP_LOGTO_M2M_CLIENT_ID: "${PP_LOGTO_M2M_CLIENT_ID:?set in .env}"
      PP_LOGTO_M2M_CLIENT_SECRET: "${PP_LOGTO_M2M_CLIENT_SECRET:?set in .env}"
      PP_LOGTO_API_RESOURCE: "${PP_LOGTO_API_RESOURCE:-https://default.logto.app/api}"
      PP_LOGTO_WEBHOOK_KEY: "${PP_LOGTO_WEBHOOK_KEY:-}"
      PP_LOGTO_ORG_ROLE_ADMIN: "${PP_LOGTO_ORG_ROLE_ADMIN:-admin}"
    volumes:
      - blob_data:/data/blobs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      # Order, not readiness: `up -d` recreates a service's dependencies
      # before it, so this makes a redeploy stop the Document Server first,
      # while this server can still receive the PutFile it sends on the way
      # down. Without it both are recreated at once and whatever was typed
      # since the file was opened is lost. (`down` and `stop` run the other
      # way round and stop this server first: stop editing before using them.)
      onlyoffice:
        condition: service_started
    networks: [edge, data, office]

  # Preview worker — optional. Remove this service and the app still works:
  # render:pdf/video/office jobs stay pending instead of failing, because
  # ClaimJobs filters on the kinds a process has renderers for.
  #
  # After first deploy, sweep files that predate it:
  #   docker compose -f compose.prod.yml run --rm worker --backfill
  worker:
    image: "ghcr.io/pp-techs/pp-hub-worker:${PP_IMAGE_TAG:?set in .env - a released tag, e.g. 0.1.0}"
    restart: unless-stopped
    environment:
      PP_DATABASE_URL: postgres://pphub:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/pphub?sslmode=disable
      PP_LOG_LEVEL: "${PP_LOG_LEVEL:-info}"
      PP_LOG_FORMAT: "${PP_LOG_FORMAT:-json}"
      PP_BLOB_ROOT: /data/blobs
      PP_BLOB_BACKEND: "${PP_BLOB_BACKEND:-local}"
      PP_S3_BUCKET: "${PP_S3_BUCKET:-}"
      PP_S3_ENDPOINT: "${PP_S3_ENDPOINT:-}"
      PP_S3_REGION: "${PP_S3_REGION:-}"
      PP_S3_ACCESS_KEY_ID: "${PP_S3_ACCESS_KEY_ID:-}"
      PP_S3_SECRET_ACCESS_KEY: "${PP_S3_SECRET_ACCESS_KEY:-}"
      PP_S3_PATH_STYLE: "${PP_S3_PATH_STYLE:-1}"
      # MUST equal the server's, or office conversion tokens are rejected.
      # When unset the worker declines office rendering rather than failing
      # those jobs — check its logs if office thumbnails never appear.
      PP_SESSION_KEY: "${PP_SESSION_KEY:?set in .env - generate with openssl rand -base64 32}"
      PP_ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      PP_WOPI_SERVER_URL: http://server:8081
      # MUST equal the Document Server's JWT_SECRET: the worker is the only
      # process that calls its conversion API, and an unsigned request comes
      # back as {"error":-8}.
      PP_ONLYOFFICE_JWT_SECRET: "${PP_ONLYOFFICE_JWT_SECRET:?set in .env - generate with openssl rand -base64 32}"
    volumes:
      - blob_data:/data/blobs
    # Runs pdftoppm and ffmpeg over user-supplied files — memory-unsafe
    # parsers with a long CVE history. No ports, no writable root, no
    # capabilities it can regain.
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
    # No listener to probe: cmd/worker touches /tmp/worker-healthy on every
    # successful Postgres+blob-store check and removes it on failure; this
    # reads the file's freshness. The image's own HEALTHCHECK does the same
    # thing for a bare `docker run` with no compose file.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-healthy -mmin -2 | grep -q worker-healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Postgres, not the server: cmd/server applies migrations *before* it waits
    # on OIDC, and the worker's store.AwaitSchema polls until they land. Gating
    # on the server being healthy would idle the worker through an OIDC outage
    # for no reason.
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, office]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pphub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
      POSTGRES_DB: pphub
    volumes:
      - pg_data:/var/lib/postgresql/data
    # No published port: nothing outside this network needs Postgres, and
    # exposing 5432 on a public VPS is how databases get found.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pphub -d pphub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  onlyoffice:
    # Pinned: `latest` has shipped WOPI-breaking changes before, and the editor
    # is the one service whose upgrade is not a restart — it migrates its own
    # cache. 10.0.0.1 is the build this stack is verified against. 10.0 made
    # one thing mandatory that 9.x did not need: an ipfilter rule that NAMES the
    # WOPI host (see the entrypoint below).
    image: onlyoffice/documentserver:10.0.0.1
    restart: unless-stopped
    # Measured at about 30 s to shut down on 10.0.0.1, against Docker's
    # default of 10 s before SIGKILL. It saves open documents on the way down.
    stop_grace_period: 60s
    expose:
      - "80"
    # PLAIN VPS: publish and give it a hostname in your own proxy.
    # ports:
    #   - "127.0.0.1:9980:80"
    environment:
      # The Document Server has no access control of its own. Without a
      # signature, anything that can reach it can drive its conversion API —
      # which means asking it to fetch a URL of the caller's choosing, from
      # inside this network, with ALLOW_PRIVATE_IP_ADDRESS below. The worker
      # signs every conversion request with the same secret
      # (PP_ONLYOFFICE_JWT_SECRET); an unsigned or wrongly-signed one comes
      # back as {"error":-8}.
      - JWT_ENABLED=true
      - JWT_SECRET=${PP_ONLYOFFICE_JWT_SECRET:?set in .env - generate with openssl rand -base64 32}
      - ONLYOFFICE_HTTPS_ENABLED=false
      # 9.x needs this to serve /hosting/discovery and /hosting/wopi/*/edit.
      - WOPI_ENABLED=true
      # PP_WOPI_SERVER_URL resolves to `server`'s container IP, which sits in
      # a private (172.16.0.0/12) range, and OnlyOffice's
      # request-filtering-agent blocks private addresses by default — without
      # this every conversion fails with the opaque {"error":-4} and every
      # editor session with a WOPI CheckFileInfo error.
      #
      # ALLOW_META_IP_ADDRESS is deliberately NOT set: the link-local range it
      # opens is 169.254.169.254, the cloud metadata endpoint, and nothing in
      # this topology is reachable there. Setting it would hand the Document
      # Server's fetcher the one address worth stealing. (The dev stack does
      # set it, because host.docker.internal lands in that range.)
      - ALLOW_PRIVATE_IP_ADDRESS=true
    # Written before the image's own entrypoint runs, as a file beside
    # local.json rather than over it: the entrypoint rewrites local.json from
    # the variables above, and node-config reads local-production-linux.json
    # after it. In the compose file and not a mounted one, because a "docker
    # raw" Dokploy application has nothing but this file on the server.
    #
    # Since 10.0 the Document Server refuses to call a WOPI host that no rule
    # names — `* allowed` no longer counts, it answers 403 "Access forbidden"
    # and the editor frame shows only that. The rules are also applied to
    # every URL it is handed to fetch (the worker's conversion source, a
    # callback), so naming `server` and refusing the rest is the point: it
    # can no longer be asked to fetch anything but this deployment's API.
    # The name is the compose service, which is what PP_WOPI_SERVER_URL
    # carries; rename the service and this must follow.
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/onlyoffice/documentserver/local-production-linux.json <<'EOF'
        {"services":{"CoAuthoring":{"ipfilter":{"rules":[
          {"address":"server","allowed":true},
          {"address":"*","allowed":false}
        ]}}}}
        EOF
        # The AI plugin. 9.x installed it on first start; 10.0.0.1 dropped it from
        # the default plugin list (and from the in-editor Plugin Manager, so a
        # user cannot add it either). The image's plugin manager installs what
        # that list names, so name it again — it fetches the plugin from
        # onlyoffice.github.io on first start; offline, the start still succeeds
        # without it. The guard keeps a plain `docker restart` from listing it twice.
        grep -q '"ai"' /var/www/onlyoffice/documentserver/sdkjs-plugins/plugin-list-default.json ||
          sed -i 's/^\[/[\n\t"ai",/' /var/www/onlyoffice/documentserver/sdkjs-plugins/plugin-list-default.json
        # Fonts. The image ships Microsoft's 2006 Calibri and Tahoma, which lack
        # most Vietnamese letters (ơ ư ạ ả ấ ế ệ ộ ứ ự …), so every one of
        # them was drawn in a different fallback face, in the editor and in
        # thumbnails alike. Without them the editor substitutes Carlito (same
        # metrics as Calibri, full Vietnamese) and Open Sans. Then a set of
        # families that do cover Vietnamese is fetched ONCE into the
        # onlyoffice_fonts volume: Debian/Ubuntu packages (static files —
        # OnlyOffice lists a variable font under its default instance's name,
        # "Montserrat Thin") and a few static files from google/fonts at a
        # pinned commit. All are open licences. Microsoft's own fonts are not
        # redistributable and are not fetched; put licensed ones in the
        # volume yourself. The image rebuilds its font list on every start, so
        # anything in the volume is picked up by a restart. The first start
        # needs outbound access (ubuntu archive, raw.githubusercontent.com);
        # offline, it starts with the image's fonts and tries again next time.
        rm -f /usr/share/fonts/truetype/msttcorefonts/CALIBRI*.TTF \
              /usr/share/fonts/truetype/msttcorefonts/[Tt]ahoma*.ttf
        export F=/usr/share/fonts/truetype/custom
        if [ ! -e $$F/.pphub-fonts-1 ]; then
          (
            set -e
            T=$$(mktemp -d); cd $$T; mkdir x
            apt-get update -qq
            apt-get download -qq fonts-roboto-unhinted fonts-roboto-slab fonts-noto-core \
              fonts-noto-mono fonts-lato fonts-inter fonts-montserrat fonts-ibm-plex \
              fonts-jetbrains-mono fonts-quicksand fonts-comfortaa fonts-cantarell \
              fonts-vollkorn fonts-linuxlibertine
            for d in *.deb; do dpkg-deb -x $$d x; done
            find x -type f ! -path '*/opentype/montserrat/*' \
              | grep -E '/((Roboto|RobotoCondensed|RobotoSlab|NotoSans|NotoSerif|NotoSansMono|Lato|Inter|Montserrat|IBMPlexSans|IBMPlexSerif|IBMPlexMono|JetBrainsMono|Quicksand|Comfortaa|Cantarell|Vollkorn)-(Regular|Bold|Italic|BoldItalic)\.(ttf|otf)|LinLibertine_(R|RB|RI|RBI)\.otf|LinBiolinum_(R|RB|RI)\.otf)$$' \
              | xargs -I{} cp {} $$F/
            export G=https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl
            for f in bevietnampro/BeVietnamPro barlow/Barlow firasans/FiraSans sarabun/Sarabun \
                     alegreyasans/AlegreyaSans spectral/Spectral; do
              for s in Regular Bold Italic BoldItalic; do echo $$f-$$s; done
            done > list
            for f in pacifico/Pacifico lobster/Lobster patrickhand/PatrickHand anton/Anton \
                     varelaround/VarelaRound; do echo $$f-Regular; done >> list
            xargs -P8 -n1 sh -c 'curl -fsSL --retry 3 -o "$$F/$${0##*/}.ttf" "$$G/$$0.ttf"' < list
            touch $$F/.pphub-fonts-1
          ) || echo "fonts: install failed, starting with the image's own fonts" >&2
        fi
        exec /app/ds/run-document-server.sh
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
      - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # The first start also downloads the fonts, which then waits on the
      # font list being rebuilt: minutes, not seconds.
      start_period: 300s
    # Only `office`. It talks to `server` (WOPI on :8081) and nothing else
    # needs to be reachable from a third-party container that fetches URLs on
    # request.
    networks: [office]

  # --profile s3
  #
  # Self-hosted object storage, for keeping blobs off the app container without
  # an external provider. Opt-in: PP_BLOB_BACKEND defaults to local disk.
  # Switching to it is also what allows more than one `server` replica.
  #
  #   docker compose -f compose.prod.yml --env-file .env.prod --profile s3 up -d
  #
  # Then set in .env.prod:
  #   PP_BLOB_BACKEND=s3
  #   PP_S3_ENDPOINT=http://seaweedfs:8333
  #   PP_S3_BUCKET=pphub
  #   PP_S3_ACCESS_KEY_ID / PP_S3_SECRET_ACCESS_KEY
  #
  # It reads the same PP_S3_* credentials the server and worker use rather than
  # a second SEAWEEDFS_* pair: two variables that "must match" are two
  # variables that eventually will not. They are optional at interpolation
  # time — the default local-disk stack must not require credentials for a
  # service it never starts — so the entrypoint below refuses to boot without
  # them instead.
  #
  # No published ports: only the server and worker talk to it.
  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    expose:
      - "8333"
    environment:
      PP_S3_ACCESS_KEY_ID: "${PP_S3_ACCESS_KEY_ID:-}"
      PP_S3_SECRET_ACCESS_KEY: "${PP_S3_SECRET_ACCESS_KEY:-}"
    # The committed s3.json carries development credentials, so production
    # writes its own from the environment at startup rather than shipping a
    # secret in the repo.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$PP_S3_ACCESS_KEY_ID" ] || [ -z "$$PP_S3_SECRET_ACCESS_KEY" ]; then
          echo "seaweedfs: set PP_S3_ACCESS_KEY_ID and PP_S3_SECRET_ACCESS_KEY in .env.prod" >&2
          exit 1
        fi
        printf '{"identities":[{"name":"pphub","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$PP_S3_ACCESS_KEY_ID" "$$PP_S3_SECRET_ACCESS_KEY" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
    healthcheck:
      # weed binds the master to the container's IP, not loopback, so
      # http://localhost:9333 is refused and this check would never pass.
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [data]

  seaweedfs-init:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:3.97
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      sh -c "echo 's3.bucket.create -name ${PP_S3_BUCKET:-pphub}' | weed shell -master=seaweedfs:9333"
    restart: "no"
    networks: [data]

# Three segments instead of one flat network.
#
# `server` is the only service on all of them, because it is the only one
# everything else has business talking to. The segment that matters is
# `office`: OnlyOffice is a third-party service, publicly hostnamed, whose
# only access control is a shared JWT secret, and it runs with
# ALLOW_PRIVATE_IP_ADDRESS=true because its own fetcher has to reach `server`
# at a private address. On one flat network that combination also let it open
# connections to postgres:5432 and seaweedfs:8333. It needs `server` and
# nothing else, so now that is all it can reach. The JWT gate is what stops
